[Launch]
ProgramExecutable=Opera\opera.exe
CommandLineArguments=--user-data-dir="%PAL:DataDir%\profile" --no-default-browser-check
; opera.exe starts the browser from the version folder; the crash reporter
; and the notification helper can outlive the browser window.
WaitForEXE1=opera.exe
WaitForEXE2=opera_crashreporter.exe
WaitForEXE3=notification_helper.exe
DirectoryMoveOK=yes
SupportsUNC=yes
MinOS=10

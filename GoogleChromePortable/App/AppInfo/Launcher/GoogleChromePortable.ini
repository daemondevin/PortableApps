[Launch]
ProgramExecutable=Chrome-bin\chrome.exe
CommandLineArguments=--user-data-dir="%PAL:DataDir%\profile" --no-default-browser-check
; Chrome's helpers can outlive the browser window.
WaitForEXE1=chrome.exe
WaitForEXE2=chrome_proxy.exe
WaitForEXE3=notification_helper.exe
DirectoryMoveOK=yes
SupportsUNC=yes
MinOS=10

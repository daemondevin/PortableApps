[Launch]
ProgramExecutable=HeidiSQL\heidisql.exe
; HeidiSQL's own portable mode, with its settings file kept in Data.
CommandLineArguments=--psettings="%PAL:DataDir%\settings\portable_settings.txt"
DirectoryMoveOK=yes
SupportsUNC=yes

; In portable mode HeidiSQL keeps its folders and tabs.ini next to
; heidisql.exe. They're moved there from Data for each session.
[DirectoriesMove]
Snippets=%PAL:AppDir%\HeidiSQL\Snippets
Backups=%PAL:AppDir%\HeidiSQL\Backups
Logs=%PAL:AppDir%\HeidiSQL\Logs
Sessionlogs=%PAL:AppDir%\HeidiSQL\Sessionlogs
Highlighters=%PAL:AppDir%\HeidiSQL\Highlighters

[FilesMove]
settings\tabs.ini=%PAL:AppDir%\HeidiSQL

; Paths in the settings (session log paths, SQLite files, private keys,
; snippets) and in tabs.ini follow the package when it moves: first the
; paths into the package, then the others on the same drive.
[FileWrite1]
Type=Replace
File=%PAL:DataDir%\settings\portable_settings.txt
Find=%PAL:LastDrive%%PAL:LastPackagePartialDir%\
Replace=%PAL:Drive%%PAL:PackagePartialDir%\

[FileWrite2]
Type=Replace
File=%PAL:DataDir%\settings\portable_settings.txt
Find=%PAL:LastDrive%\
Replace=%PAL:Drive%\

[FileWrite3]
Type=Replace
File=%PAL:DataDir%\settings\tabs.ini
Find=%PAL:LastDrive%%PAL:LastPackagePartialDir%\
Replace=%PAL:Drive%%PAL:PackagePartialDir%\

[FileWrite4]
Type=Replace
File=%PAL:DataDir%\settings\tabs.ini
Find=%PAL:LastDrive%\
Replace=%PAL:Drive%\

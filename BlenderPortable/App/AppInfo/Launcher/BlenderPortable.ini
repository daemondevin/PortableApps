[Launch]
; Without Blender in App\Blender, custom.nsh offers to download it.
ProgramExecutable=Blender\blender-launcher.exe
DirectoryMoveOK=yes
SupportsUNC=yes
MinOS=10
; blender-launcher.exe starts blender.exe without a console window and
; exits; the launcher waits for Blender itself.
WaitForEXE1=blender.exe

; Blender's user folders are kept in Data\Blender. Blender only uses a folder
; named here when it exists, so custom.nsh creates them before each launch.
[Environment]
BLENDER_USER_RESOURCES=%PAL:DataDir%\Blender
BLENDER_USER_CONFIG=%PAL:DataDir%\Blender\config
BLENDER_USER_SCRIPTS=%PAL:DataDir%\Blender\scripts
BLENDER_USER_EXTENSIONS=%PAL:DataDir%\Blender\extensions
BLENDER_USER_DATAFILES=%PAL:DataDir%\Blender\datafiles

; Blender's caches (asset library indexes, shader caches) have no variable of
; their own; they're moved in and out for each session.
[DirectoriesMove]
Blender\local=%LOCALAPPDATA%\Blender Foundation\Blender

[DirectoriesCleanupIfEmpty]
1=%LOCALAPPDATA%\Blender Foundation

[Launch]
ProgramExecutable=AIMP\AIMP.exe
; AIMP's tag editor and audio converter, its access rights helper and its
; updater can outlive the player window, so the launcher waits for them too.
WaitForEXE1=AIMPac.exe
WaitForEXE2=AIMPate.exe
WaitForEXE3=Elevator.exe
WaitForEXE4=UpdateInstaller.exe
RefreshShellIcons=both
DirectoryMoveOK=yes
SupportsUNC=yes
MinOS=7

[Activate]
MissingApp=true

; AIMP's license only allows its original installer to be passed on, so the
; package doesn't include AIMP. Until it's added, the launcher says what to
; do and stops.
[MissingApp]
Reason=AIMP's license only allows its original installer to be passed on, so it can't be included.
URL=https://www.aimp.ru/?do=download
Folder=AIMP
RequiredFile1=AIMP\AIMP.Runtime.dll
RequiredFile2=AIMP\AIMP.Shared.dll

; AIMP.ini next to AIMP.exe with UserMode=0 is what makes AIMP portable: it
; then keeps its whole profile in the Profile folder next to it. Both are
; kept in Data and moved into place while AIMP runs.
[FilesMove]
AIMP.ini=%PAL:AppDir%\AIMP

[DirectoriesMove]
Profile=%PAL:AppDir%\AIMP\Profile

; The language follows the PortableApps.com Platform. Outside the Platform the
; language chosen in AIMP itself is kept.
[Language]
Base=%PAL:LanguageName%
Default=English
CheckIfExists=%PAL:AppDir%\AIMP\Langs\%PAL:LanguageCustom%
DefaultIfNotExists=english.lng

[LanguageStrings]
Arabic=arabic.lng
Armenian=armenian.lng
Basque=basque.lng
Belarusian=belarusian_official.lng
Bulgarian=bulgarian.lng
Catalan=catalan.lng
Croatian=croatian.lng
Czech=czech.lng
English=english.lng
Farsi=farsi.lng
French=french.lng
Georgian=georgian.lng
German=german.lng
Hungarian=hungarian.lng
Italian=italian.lng
Japanese=japanese.lng
Korean=korean.lng
Kurdish=kurdish.lng
Macedonian=macedonian.lng
Polish=polish.lng
Portuguese=portuguese.lng
Romanian=romanian.lng
Russian=russian.lng
Serbian=serbian_cyrillic.lng
Serbianlatin=serbian_latin.lng
Simpchinese=simplified_chinese.lng
Slovenian=slovenian.lng
Spanish=spanish.lng
Swedish=swedish.lng
Turkish=turkish.lng
Ukrainian=ukrainian.lng
Uzbek=uzbek.lng

[LanguageFile]
Type=INI
File=%PAL:DataDir%\AIMP.ini
Section=System
Key=DefaultLang

[FileWrite1]
Type=INI
File=%PAL:DataDir%\AIMP.ini
Section=Languages
Key=default
Value=%PAL:LanguageCustom%

[FileWrite2]
Type=INI
File=%PAL:DataDir%\AIMP.ini
Section=System
Key=DefaultLang
Value=%PAL:LanguageCustom%

; AIMP stores the full paths of files and folders it's been given in its
; profile. When the package or the PortableApps.com Platform moves (another
; drive letter, another folder), these are updated to match.
[FileWrite3]
Type=Replace
File=%PAL:DataDir%\Profile\AIMP.ini
Find=%PAL:LastDrive%%PAL:LastPackagePartialDir%\
Replace=%PAL:Drive%%PAL:PackagePartialDir%\

[FileWrite4]
Type=Replace
File=%PAL:DataDir%\Profile\AIMP.ini
Find=%PAL:LastPortableAppsBaseDir%\
Replace=%PAL:PortableAppsBaseDir%\

[FileWrite5]
Type=Replace
File=%PAL:DataDir%\Profile\AIMPate.ini
Find=%PAL:LastDrive%%PAL:LastPackagePartialDir%\
Replace=%PAL:Drive%%PAL:PackagePartialDir%\

[FileWrite6]
Type=Replace
File=%PAL:DataDir%\Profile\AIMPate.ini
Find=%PAL:LastPortableAppsBaseDir%\
Replace=%PAL:PortableAppsBaseDir%\

[FileWrite7]
Type=Replace
File=%PAL:DataDir%\Profile\AIMPac.ini
Find=%PAL:LastDrive%%PAL:LastPackagePartialDir%\
Replace=%PAL:Drive%%PAL:PackagePartialDir%\

[FileWrite8]
Type=Replace
File=%PAL:DataDir%\Profile\AIMPac.ini
Find=%PAL:LastPortableAppsBaseDir%\
Replace=%PAL:PortableAppsBaseDir%\

; Recordings go to Data\Recorded. The default profile carries a placeholder
; for the folder, filled in here on the first launch.
[FileWrite9]
Type=INI
File=%PAL:DataDir%\Profile\AIMP.ini
Section=AIMPSoundOut
Key=CaptureDestFolder
Value=%PAL:DataDir%\Recorded\

[AIMPPortable]
AdditionalParameters=
SystemIntegration=false

# AdditionalParameters=
; Extra command line switches passed to AIMP.

# SystemIntegration= (true, false)
; With false, AIMP's options for file types, the Explorer context menu,
; AutoPlay and Default Programs do nothing, because they change Windows for
; every user and can't be undone without administrator rights. With true,
; AIMP may make those changes; they stay until you turn the options off in
; AIMP again.

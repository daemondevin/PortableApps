[Launch]
ProgramExecutable=OORegEditor\OORegEditor.exe
ProgramExecutable64=OORegEditor\OORegEditor_x64.exe
; Both editions are built to require administrator rights. The launcher is
; elevated too, so it can start them and undo what they change in HKLM.
RunAsAdmin=force
; A .reg association changes how Explorer shows .reg files.
RefreshShellIcons=both
DirectoryMoveOK=yes
SupportsUNC=yes

[Activate]
MissingApp=true

; O&O's license doesn't allow O&O RegEditor to be passed on inside a
; package like this one, so it isn't included. Until it's added, the
; launcher says what to do and stops.
[MissingApp]
Reason=O&O's license doesn't allow O&O RegEditor to be passed on inside another package, so it can't be included.
URL=https://www.oo-software.com/en/ooregeditor
Folder=OORegEditor

; O&O RegEditor keeps every setting (window layout, favorites, the address
; history) in OORegEdt.ini next to the program, shared by the 32-bit and
; 64-bit editions. It's kept in Data and moved into place while it runs.
[FilesMove]
OORegEdt.ini=%APPDATA%\OO Software\OO RegEditor

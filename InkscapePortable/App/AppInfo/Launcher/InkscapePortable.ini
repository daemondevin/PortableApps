[Launch]
ProgramExecutable=Inkscape\bin\inkscape.exe
DirectoryMoveOK=yes
SupportsUNC=yes
MinOS=10

[Activate]
XML=true
MissingApp=true

; Until Inkscape is added, the launcher says what to do and stops.
[MissingApp]
Reason=Inkscape is downloaded from inkscape.org and unpacked into this package.
URL=https://inkscape.org/release/
Folder=Inkscape

; The profile and GTK's user folders are kept in Data; the fontconfig file
; is written by custom.nsh for each launch.
[Environment]
INKSCAPE_PROFILE_DIR=%PAL:DataDir%\Inkscape
XDG_DATA_HOME=%PAL:DataDir%\GLib\data
XDG_CONFIG_HOME=%PAL:DataDir%\GLib\config
XDG_CACHE_HOME=%PAL:DataDir%\GLib\cache
FONTCONFIG_FILE=%PAL:DataDir%\GLib\fonts.conf

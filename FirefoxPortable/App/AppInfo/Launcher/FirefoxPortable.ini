[Launch]
ProgramExecutable=Firefox\firefox.exe
ProgramExecutable64=Firefox64\firefox.exe
CommandLineArguments=-profile "%PAL:DataDir%\profile"
; Firefox's launcher process starts the browser as a new firefox.exe and
; exits. The crash helper, the crash reporter and the ping sender can
; outlive the browser window too.
WaitForEXE1=firefox.exe
WaitForEXE2=crashhelper.exe
WaitForEXE3=crashreporter.exe
WaitForEXE4=pingsender.exe
DirectoryMoveOK=yes
SupportsUNC=yes
MinOS=10

; Crash reports go next to the profile instead of %APPDATA%\Mozilla.
[Environment]
MOZ_CRASHREPORTER_DATA_DIRECTORY=%PAL:DataDir%\CrashReports

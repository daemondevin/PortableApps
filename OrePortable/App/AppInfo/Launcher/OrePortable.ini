[Launch]
ProgramExecutable=ore\ore.exe
DirectoryMoveOK=yes
SupportsUNC=yes
MinOS=10

[Activate]
DirectoryCleanup=true

[DirectoriesMove]
AppData=%APPDATA%\dev.ore.gems
LocalAppData=%LOCALAPPDATA%\dev.ore.gems

; WebView2's caches are rebuilt on the next start, so they aren't carried
; back to the drive. Storage, preferences and the high scores are kept.
[DirectoriesCleanupForce]
1=%LOCALAPPDATA%\dev.ore.gems\EBWebView\Default\Cache
2=%LOCALAPPDATA%\dev.ore.gems\EBWebView\Default\Code Cache
3=%LOCALAPPDATA%\dev.ore.gems\EBWebView\Default\GPUCache
4=%LOCALAPPDATA%\dev.ore.gems\EBWebView\Default\DawnGraphiteCache
5=%LOCALAPPDATA%\dev.ore.gems\EBWebView\Default\DawnWebGPUCache
6=%LOCALAPPDATA%\dev.ore.gems\EBWebView\GrShaderCache
7=%LOCALAPPDATA%\dev.ore.gems\EBWebView\ShaderCache
8=%LOCALAPPDATA%\dev.ore.gems\EBWebView\Crashpad

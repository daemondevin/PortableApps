[Launch]
ProgramExecutable=AndroidStudio\bin\studio64.exe
DirectoryMoveOK=yes
SupportsUNC=no
MinOS=10
; The emulator keeps running after Android Studio closes; the launcher waits
; for it too.
WaitForEXE1=studio64.exe
WaitForEXE2=qemu-system-x86_64.exe
WaitForEXE3=qemu-system-aarch64.exe
WaitForEXE4=emulator.exe

[Activate]
MissingApp=true

; Until Android Studio is added, the launcher says what to do and stops.
[MissingApp]
Reason=Android Studio is downloaded from developer.android.com as its zip (not the installer) and unpacked into this package.
URL=https://developer.android.com/studio#downloads
Folder=AndroidStudio
RequiredFile1=AndroidStudio\product-info.json

; The IDE's settings, caches, plugins and logs go where idea.properties says
; (custom.nsh writes it for every launch); the SDK, the SDK tools' settings
; and AVDs, and Gradle's caches are kept in Data too.
[Environment]
STUDIO_PROPERTIES=%PAL:DataDir%\AndroidStudio\idea.properties
ANDROID_HOME=%PAL:DataDir%\Sdk
ANDROID_SDK_ROOT=%PAL:DataDir%\Sdk
ANDROID_USER_HOME=%PAL:DataDir%\.android
ANDROID_EMULATOR_HOME=%PAL:DataDir%\.android
ANDROID_AVD_HOME=%PAL:DataDir%\.android\avd
GRADLE_USER_HOME=%PAL:DataDir%\.gradle

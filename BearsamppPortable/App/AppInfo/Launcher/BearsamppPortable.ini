[Launch]
; Bearsampp is 64-bit only; the launcher refuses to start on 32-bit Windows
; (see custom.nsh).
ProgramExecutable=Bearsampp\bearsampp.exe
WorkingDirectory=%PAL:AppDir%\Bearsampp
; Bearsampp installs its servers (Apache, MySQL, MariaDB, PostgreSQL and the
; rest) as Windows services and sets machine-wide environment variables, so
; it only runs as administrator.
RunAsAdmin=force
MinOS=10
; Bearsampp updates the paths in its own configuration when its folder moves.
DirectoryMoveOK=yes
SupportsUNC=no
; One Bearsampp at a time: an installed one uses the same service names.
SingleAppInstance=true
SinglePortableAppInstance=true
; Bearsampp restarts itself after it changes its environment variables, and
; stops and removes its services before it quits, so waiting for every
; bearsampp.exe covers both.
WaitForEXE1=bearsampp.exe

[Activate]
Runtime=true
MissingApp=true

[MissingApp]
Reason=Bearsampp is to large to package. Must download yourself.
URL=https://github.com/Bearsampp/Bearsampp/releases


[VCRuntime1]
Version=2015-2022
Architecture=x64
Installer=VC_redist.x64.exe
Required=true

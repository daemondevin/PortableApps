; Keeps the parts of Bearsampp that hold your work and your choices when
; Bearsampp Portable is installed over an older copy: the sites in www, the
; virtual hosts, aliases and certificates, the module versions you added or
; changed (including the databases inside them), the logs and the settings.
[DirectoriesToPreserve]
PreserveDirectory1=App\Bearsampp\www
PreserveDirectory2=App\Bearsampp\vhosts
PreserveDirectory3=App\Bearsampp\alias
PreserveDirectory4=App\Bearsampp\ssl
PreserveDirectory5=App\Bearsampp\bin
PreserveDirectory6=App\Bearsampp\apps
PreserveDirectory7=App\Bearsampp\tools
PreserveDirectory8=App\Bearsampp\logs
PreserveDirectory9=App\Bearsampp\cgi-bin

[FilesToPreserve]
PreserveFile1=App\Bearsampp\bearsampp.conf

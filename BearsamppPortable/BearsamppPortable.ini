[BearsamppPortable]
UpdateCheck=true
UpdateEdition=lite
KeepRootCA=false

# UpdateCheck= (true, false)
; Check GitHub for a newer Bearsampp each time it starts, and offer to update.
; An update replaces Bearsampp itself; your sites, databases, settings,
; certificates and module versions are kept.

# UpdateEdition= (lite, basic, full)
; The release download an update comes from. All three contain the same
; Bearsampp; they differ in how many module versions they bundle, and only
; Bearsampp itself is taken from it. lite is the smallest download.

# KeepRootCA= (true, false)
; Bearsampp's development root certificate makes https://localhost trusted
; in the browser. With false it is only trusted while Bearsampp Portable
; runs, and Windows asks to confirm its removal afterwards. Set it to true to
; keep it trusted on this computer.

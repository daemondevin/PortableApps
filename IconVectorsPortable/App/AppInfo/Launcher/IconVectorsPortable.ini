[Launch]
ProgramExecutable=IconVectors\IconVectors.exe
DirectoryMoveOK=yes
SupportsUNC=yes
MinOS=10

[Activate]
MissingApp=true

; IconVectors is commercial; you add your own licensed copy. Until then,
; the launcher says what to do and stops.
[MissingApp]
Reason=IconVectors is commercial software by Axialis. Add your own licensed copy from axialis.com to this package.
URL=https://www.axialis.com/iconvectors/
Folder=IconVectors

; Palettes, icon packs and autosaved drawings.
[DirectoriesMove]
IconVectors=%APPDATA%\Axialis\IconVectors

[DirectoriesCleanupIfEmpty]
1=%APPDATA%\Axialis

[Launch]
ProgramExecutable=LYNX\LYNX.exe
DirectoryMoveOK=yes
SupportsUNC=yes
MinOS=10

[Activate]
Registry=true

; Every place LYNX SHARE writes to (settings, plugin list, autosaves, crash
; logs, caches, Documents\LYNX) goes under the folder this names.
[Environment]
LYNX_PROFILE_DIR=%PAL:DataDir%\Profile

; LYNX SHARE registers .lynx project files for the current user. That
; registration lasts only while it runs; one the computer had is put back.
[RegistryKeys]
-=HKCU\Software\Classes\.lynx
-=HKCU\Software\Classes\LYNX.Project

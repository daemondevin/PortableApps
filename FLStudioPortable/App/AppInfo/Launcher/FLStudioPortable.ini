[Launch]
; FL Studio is 64-bit only. The x64 build also runs on Windows 11 on ARM,
; emulated; the launcher refuses to start on 32-bit Windows (see custom.nsh).
; Scaled=true in FLStudioPortable.ini starts "FL64 (scaled).exe" instead.
ProgramExecutable=FLStudio\FL64.exe
DirectoryMoveOK=yes
SupportsUNC=no
MinOS=10
; An installed FL Studio that is running would share the registry settings
; and the Image-Line folders with this one, so the launch stops when one is
; open.
SingleAppInstance=true
; A second launch hands its files to the running FL Studio.
SinglePortableAppInstance=false
RefreshShellIcons=both

[Activate]
MissingApp=true
Symlinks=true

[MissingApp]
Reason=commercial
URL=https://www.image-line.com/
Folder=FLStudio
RequiredFile1=FLStudio\FL64.exe
RequiredFile2=FLStudio\FLEngine_x64.dll

; FL Studio's user data folder (projects, presets, recordings, renders,
; hardware scripts and its settings files) and %APPDATA%\Image-Line are
; linked into Data while it runs, so nothing is copied back and forth. A real
; folder already in either place (from an installed FL Studio) is moved
; aside for the session and put back afterwards.
; %ProgramData%\FL Cloud Plugins is linked too, but by custom.nsh: an
; installed FL Studio's copy of it can't always be moved without
; administrator rights, and then it is left in use instead.
[Symlink1]
Type=junction
Source=Image-Line
Target=%DOCUMENTS%\Image-Line

[Symlink2]
Type=junction
Source=AppData\Image-Line
Target=%APPDATA%\Image-Line

; Registry keys journaled for the session besides HKCU\Software\Image-Line
; (which custom.nsh loads from and saves to Data\settings\Image-Line.reg).
; A key that didn't exist is deleted when FL Studio closes; one that did is
; put back exactly as it was.
[FLStudioRegistry]
1=HKCU\Software\ASIO
2=HKCU\Software\Classes\.flp
3=HKCU\Software\Classes\.fsc
4=HKCU\Software\Classes\.fst
5=HKCU\Software\Classes\.flkey

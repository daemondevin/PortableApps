[FLStudioPortable]
AdditionalParameters=
DisableSplashScreen=false
RunLocally=false
Scaled=false
Symlinks=true

# Scaled=
; Start "FL64 (scaled).exe" instead of FL64.exe (true|false). Windows scales
; that build up on high DPI screens, like the "FL Studio (scaled)" shortcut of
; an installed FL Studio.

# Symlinks=
; Link FL Studio's folders into Data while it runs (true|false). With false,
; FL Studio uses the folders on this computer and nothing in them travels
; with the package.

# AdditionalParameters=
; Pass additional command-line switches.

# DisableSplashScreen=
; Don't show the launcher's splash screen.

# RunLocally=
; Copy FL Studio to the TEMP folder and run it from there (for read-only
; media). Changes made in that session aren't saved back.

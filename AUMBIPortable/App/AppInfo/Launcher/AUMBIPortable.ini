[Launch]
ProgramExecutable=AUMBI\AUMBI.exe
; AUMBI partitions and formats drives, so it's built to always run as an
; administrator. The launcher asks for those rights first so it can start it.
RunAsAdmin=force
DirectoryMoveOK=yes
SupportsUNC=yes
MinOS=7

[Activate]
MissingApp=true

; Until AUMBI is added, the launcher says what to do and stops.
[MissingApp]
Reason=AUMBI is downloaded from its author's page and added to this package.
URL=https://niwrad.gumroad.com/l/aumbi
Folder=AUMBI

[Launch]
; Without Notepad++ in App\Notepad++, custom.nsh offers to download it.
ProgramExecutable=Notepad++\notepad++.exe
; Notepad++ keeps its settings, sessions, themes and backups in the folder
; given here; custom.nsh points the rest (plugin settings, the theme lookup)
; at it too.
CommandLineArguments=-settingsDir="%PAL:DataDir%\Config"
DirectoryMoveOK=yes
SupportsUNC=yes
; Plugins Admin closes Notepad++, installs with GUP.exe and starts it again.
WaitForEXE1=notepad++.exe
WaitForEXE2=GUP.exe

[Activate]
Fonts=true

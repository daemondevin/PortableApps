[EmergencyKitPortable]
AdditionalParameters=
Language=

# AdditionalParameters=
; Extra command line switches passed to Emergency Kit.

# Language= (for example Language=de-de)
; Leave it empty to use the PortableApps.com Platform's language, or the one
; chosen in Emergency Kit when the Platform isn't used.
; cs-cz = Czech
; de-de = German
; en-us = English
; es-es = Spanish
; fa-ir = Farsi
; fi-fi = Finnish
; fr-fr = French
; hu-hu = Hungarian
; it-it = Italian
; ja-jp = Japanese
; ko-kr = Korean
; nl-nl = Dutch
; pl-pl = Polish
; pt-br = Portuguese (Brazil)
; ru-ru = Russian
; sl-si = Slovenian
; tr-tr = Turkish
; zh-cn = Chinese (Simplified)
; zh-tw = Chinese (Traditional)

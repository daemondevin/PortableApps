[CheckRunning]
CloseEXE=a2emergencykit.exe,a2cmd.exe

; Emergency Kit updates its own program files and signatures inside
; App\EEK\bin64. Reinstalling the package keeps the signatures it has
; downloaded, so the next update doesn't start from the packaged ones again.
[DirectoriesToPreserve]
PreserveDirectory1=App\EEK\bin64\Signatures

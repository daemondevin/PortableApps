[Launch]
; Emergency Kit is 64-bit only since 2020 and needs Windows 10 or later. The
; launcher refuses to start on 32-bit Windows (see custom.nsh).
ProgramExecutable=EEK\bin64\a2emergencykit.exe
WorkingDirectory=%PAL:AppDir%\EEK\bin64
; Scanning memory, other users' files and the registry, and loading the
; scanner's driver, all need administrator rights.
RunAsAdmin=force
MinOS=10
DirectoryMoveOK=yes
SupportsUNC=no
SingleAppInstance=true
SinglePortableAppInstance=true
; Emergency Kit restarts itself after it updates its own program files, so
; every copy of either scanner is waited for.
WaitForEXE1=a2emergencykit.exe
WaitForEXE2=a2cmd.exe

[Activate]
MissingApp=true

[MissingApp]
Reason=noredistribute
URL=https://www.emsisoft.com/en/emergency-kit/

; Emergency Kit keeps its settings, logs, reports and quarantine next to its
; bin64 folder. They live in Data and are moved into place while it runs.
[FilesMove]
settings\a2*.ini=%PAL:AppDir%\EEK
settings\a2user.dat=%PAL:AppDir%\EEK

[DirectoriesMove]
Logs=%PAL:AppDir%\EEK\Logs
Quarantine=%PAL:AppDir%\EEK\Quarantine
Reports=%PAL:AppDir%\EEK\Reports

; The language follows the PortableApps.com Platform. Outside the Platform
; the language chosen in Emergency Kit itself is kept, and Language= in
; EmergencyKitPortable.ini overrides both (see custom.nsh).
[Language]
Base=%PAL:LanguageLCID%
Default=en-us
CheckIfExists=%PAL:AppDir%\EEK\bin64\Languages\%PAL:LanguageCustom%.lng
DefaultIfNotExists=en-us

[LanguageStrings]
1028=zh-tw
1029=cs-cz
1031=de-de
1033=en-us
1034=es-es
1035=fi-fi
1036=fr-fr
1038=hu-hu
1040=it-it
1041=ja-jp
1042=ko-kr
1043=nl-nl
1045=pl-pl
1046=pt-br
1049=ru-ru
1055=tr-tr
1060=sl-si
1065=fa-ir
2052=zh-cn
3082=es-es

[LanguageFile]
Type=INI
File=%PAL:DataDir%\settings\a2settings.ini
Section=General
Key=Language

[FileWrite1]
Type=INI
File=%PAL:DataDir%\settings\a2settings.ini
Section=General
Key=Language
Value=%PAL:LanguageCustom%

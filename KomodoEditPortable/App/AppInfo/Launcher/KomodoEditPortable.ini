[Launch]
; komodo.exe is a small starter: it runs lib\mozilla\komodo.exe and exits.
; The launcher waits for every komodo.exe, so it waits for the real one.
ProgramExecutable=KomodoEdit\komodo.exe
WaitForEXE1=ko.exe
MinOS=7
; An installed Komodo Edit that is running would be handed this copy's files.
SingleAppInstance=true
; A second launch hands its files to the running Komodo Edit.
SinglePortableAppInstance=false
DirectoryMoveOK=yes
SupportsUNC=yes

[Activate]
XML=true

; Komodo keeps its settings, its toolbox and its Mozilla profile in one
; folder per version below this one (Data\ActiveState\KomodoEdit\12.0). Komodo
; reads it from this variable, so nothing is copied, linked or moved.
[Environment]
KOMODO_USERDATADIR=%PAL:DataDir%\ActiveState\KomodoEdit

; Folders Komodo and its Mozilla platform make outside that folder: crash
; reports, the update folder, and the default settings folder. Ones that
; don't exist before Komodo starts are removed when it closes (see
; custom.nsh).
[KomodoFolders]
1=%APPDATA%\ActiveState\Komodo Edit
2=%LOCALAPPDATA%\ActiveState\Komodo Edit
3=%LOCALAPPDATA%\ActiveState\KomodoEdit

; New projects go to Data\Workspace unless the project folder was changed
; in Komodo's preferences.
[FileWrite1]
Type=XML text
File=%PAL:DataDir%\ActiveState\KomodoEdit\12.0\prefs.xml
XPath=/preference-set[@id="global"]/string[@id="projects-dir"]
Value=%PAL:DataDir%\Workspace

; Komodo and Mozilla remember files and add-ons by their full path. When
; the package has moved (another drive letter or folder), the paths that
; point into it are updated.
[FileWrite2]
Type=Replace
File=%PAL:DataDir%\ActiveState\KomodoEdit\12.0\prefs.xml
Find=%PAL:LastDrive%%PAL:LastPackagePartialDir%\
Replace=%PAL:Drive%%PAL:PackagePartialDir%\

[FileWrite3]
Type=Replace
File=%PAL:DataDir%\ActiveState\KomodoEdit\12.0\prefs.xml
Find=%PAL:LastDrive%%PAL:LastPackagePartialDir:Forwardslash%/
Replace=%PAL:Drive%%PAL:PackagePartialDir:Forwardslash%/

[FileWrite4]
Type=Replace
File=%PAL:DataDir%\ActiveState\KomodoEdit\12.0\XRE\prefs.js
Find=%PAL:LastDrive%%PAL:LastPackagePartialDir:DoubleBackslash%\\
Replace=%PAL:Drive%%PAL:PackagePartialDir:DoubleBackslash%\\

[FileWrite5]
Type=Replace
File=%PAL:DataDir%\ActiveState\KomodoEdit\12.0\XRE\extensions.json
Find=%PAL:LastDrive%%PAL:LastPackagePartialDir:DoubleBackslash%\\
Replace=%PAL:Drive%%PAL:PackagePartialDir:DoubleBackslash%\\

[FileWrite6]
Type=Replace
File=%PAL:DataDir%\ActiveState\KomodoEdit\12.0\XRE\extensions.ini
Find=%PAL:LastDrive%%PAL:LastPackagePartialDir%\
Replace=%PAL:Drive%%PAL:PackagePartialDir%\

; Mozilla's startup cache holds the old paths too; it is rebuilt on the next
; start.
[DirectoriesCleanupForce]
1=%PAL:DataDir%\ActiveState\KomodoEdit\12.0\XRE\startupCache

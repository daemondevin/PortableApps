[O&ODefragPortable]
AdditionalParameters=
DisableSplashScreen=false
Symlinks=true

# Symlinks=
; Link O&O Defrag's data folder into Data while it runs (true|false). With
; false, O&O Defrag uses the folder on this computer.

# AdditionalParameters=
; Pass additional command-line switches.

# DisableSplashScreen=
; Don't show the launcher's splash screen.

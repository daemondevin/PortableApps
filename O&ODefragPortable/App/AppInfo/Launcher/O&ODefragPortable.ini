[Launch]
; O&O Defrag Professional is 64-bit only; the launcher refuses to start on
; 32-bit Windows (see custom.nsh).
ProgramExecutable64=oodefrag\OODefragMUI.exe
WorkingDirectory=%PAL:AppDir%\oodefrag
; The defrag agent is a Windows service, which needs administrator rights.
RunAsAdmin=force
MinOS=10
DirectoryMoveOK=yes
SupportsUNC=no
SingleAppInstance=true
; The interface can leave its tray icon and the update check running; the
; launcher waits for them before it removes the service.
WaitForEXE1=OODefragTray.exe
WaitForEXE2=oodtrwnd.exe
WaitForEXE3=ooliveupdate.exe

[Activate]
Registry=true
; Firewall=true
Symlinks=true
RegDLLs=true
Services=true
Runtime=true
MissingApp=true

[MissingApp]
Reason=commercial
URL=https://www.oo-software.com/en/products/oodefrag

[RegistryValueWrite]
HKLM\SOFTWARE\O&O\O&O Defrag\30\Pro\licenses\User=REG_SZ:xanax
HKLM\SOFTWARE\O&O\O&O Defrag\30\Pro\licenses\Company=REG_SZ:O&O Software GmbH
HKLM\SOFTWARE\O&O\O&O Defrag\30\Pro\licenses\SerialNo=REG_SZ:DPMX-0CL6-KABC-7E9L-249B

; The interface needs .NET 8 with the Windows Desktop runtime. When it is
; missing, the user is offered the installer from App\Prerequisites (it
; stays installed: other programs may come to rely on it).
[NETRuntime1]
Framework=net8.0
Kind=core
Architecture=x64
MinVersion=8.0.0
Installer=windowsdesktop-runtime-8.0.21-win-x64.exe
Required=true

[NETRuntime2]
Framework=net8.0
Kind=desktop
Architecture=x64
MinVersion=8.0.0
Installer=windowsdesktop-runtime-8.0.21-win-x64.exe
Required=true

; [FirewallRule1]
; BlockAll=true
; BlockAllDir=%PAL:AppDir%\oodefrag
; BlockAllRecur=true

; The O&O Defrag agent does the actual work; the interface only talks to
; it. It is created for the session (or an installed O&O Defrag's agent is
; pointed at the package for the session) and removed or restored when
; O&O Defrag closes, or on the next launch after a crash.
[Service1]
Name=OODefragAgent
Path="%PAL:AppDir%\oodefrag\oodag.exe"
DisplayName=O&O Defrag
Type=own
Start=demand
IfExists=replace
Required=true

; The drive map control the interface hosts.
[RegisterDLL1]
Type=REGDLL
File=%PAL:AppDir%\oodefrag\oodpeo.ocx
Scope=machine
CLSID={8AC29A61-573D-11D4-9385-005004518EC8}

; O&O Defrag's local data (logs, reports, interface settings) is linked
; into Data while it runs. A real folder already there (from an installed
; O&O Defrag) is moved aside for the session and put back afterwards.
[Symlink1]
Type=junction
Source=OO Defrag
Target=%LOCALAPPDATA%\OO Software\OO Defrag

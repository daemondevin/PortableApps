[Launch]
ProgramExecutable=BitLord\BitLord.exe
WorkingDirectory=%PAL:AppDir%\BitLord
; Elevation is for the firewall rules below. BitLord itself runs as the
; user (ExecAsUser), never elevated.
RunAsAdmin=force
SinglePortableAppInstance=true
SingleAppInstance=true
DirectoryMoveOK=yes
SupportsUNC=yes
RefreshShellIcons=both
MinOS=10

[Activate]
Registry=true
ExecAsUser=true
Runtime=true
Firewall=true
MissingApp=true
DirectoryCleanup=true

; BitLord's license doesn't allow passing it on, so the package doesn't
; include it.
[MissingApp]
Reason=noredistribute
URL=https://www.bitlord.com/download/
Folder=BitLord
RequiredFile1=BitLord\python.zip
RequiredFile2=BitLord\torrent-rasterbar.dll
RequiredFile3=BitLord\Qt6WebEngineCore.dll
RequiredFile4=BitLord\QtWebEngineProcess.exe

; Every BitLord file is 64-bit and needs the Visual C++ 2015-2022 runtime.
[VCRuntime1]
Version=2015-2022
Architecture=x64
MinVersion=14.24.28127.4
Installer=vcredist_msvc2019_x64.exe
Required=true

; BitLord's settings, in Data\settings\BitLord.reg between sessions.
; Anything BitLord does to the file associations of .torrent files and
; magnet links is undone: those keys are put back as they were.
[RegistryKeys]
BitLord=HKCU\Software\bitlord.com\BitLord
-=HKCU\Software\Classes\.torrent
-=HKCU\Software\Classes\BitLord
-=HKCU\Software\Classes\Magnet
-=HKCU\Software\Classes\torrentstream

[RegistryValueBackupDelete]
1=HKCU\Software\Microsoft\Windows\CurrentVersion\Run\BitLord

[RegistryCleanupIfEmpty]
1=HKCU\Software\bitlord.com

; BitLord's own update check downloads its installer, which comes with
; offers for other software, so it stays off; and so does starting with
; Windows and asking to take over the file associations.
[FileWrite1]
Type=INI
File=%PAL:DataDir%\settings\BitLord.reg
Section=HKEY_CURRENT_USER\Software\bitlord.com\BitLord\coreconfig
Key='"new_release_check"'
Value='"false"'

[FileWrite2]
Type=INI
File=%PAL:DataDir%\settings\BitLord.reg
Section=HKEY_CURRENT_USER\Software\bitlord.com\BitLord\uiconfig
Key='"check_new_releases"'
Value='"false"'

[FileWrite3]
Type=INI
File=%PAL:DataDir%\settings\BitLord.reg
Section=HKEY_CURRENT_USER\Software\bitlord.com\BitLord\uiconfig
Key='"run_at_startup"'
Value='"false"'

[FileWrite4]
Type=INI
File=%PAL:DataDir%\settings\BitLord.reg
Section=HKEY_CURRENT_USER\Software\bitlord.com\BitLord\uiconfig
Key='"check_associations"'
Value='"false"'

; Download folders and other paths follow the package when it moves: first
; the paths into the package, then the others on the same drive.
[FileWrite5]
Type=Replace
File=%PAL:DataDir%\settings\BitLord.reg
Find=%PAL:LastDrive%%PAL:LastPackagePartialDir:DoubleBackslash%\\
Replace=%PAL:Drive%%PAL:PackagePartialDir:DoubleBackslash%\\

[FileWrite6]
Type=Replace
File=%PAL:DataDir%\settings\BitLord.reg
Find=%PAL:LastDrive%\\
Replace=%PAL:Drive%\\

; BitLord's data, and its browser's profile and caches.
[DirectoriesMove]
BitLord=%APPDATA%\BitLord
BrowserCache=%LOCALAPPDATA%\BitLord

; The browser's caches are rebuilt as needed, so they aren't carried back.
[DirectoriesCleanupForce]
1=%LOCALAPPDATA%\BitLord\BrowserCache
2=%LOCALAPPDATA%\BitLord\BrowserData\GPUCache

; Incoming connections from other peers, for as long as BitLord runs.
[FirewallRule1]
Name=BitLord TCP
Direction=In
Action=Allow
Protocol=TCP
Profile=Private
Program=%PAL:AppDir%\BitLord\BitLord.exe
Required=true

[FirewallRule2]
Name=BitLord UDP
Direction=In
Action=Allow
Protocol=UDP
Profile=Private
Program=%PAL:AppDir%\BitLord\BitLord.exe
Required=true

[Launch]
ProgramExecutable=ISOrack\isorack-app.exe
; ISOrack's manifest requires administrator rights (diskpart and raw disk
; access), and a program that requires them can't be started from a
; launcher that doesn't have them.
RunAsAdmin=force
DirectoryMoveOK=yes
SupportsUNC=yes
MinOS=10
; ISOrack's test boot runs QEMU in a window of its own, which can outlive
; ISOrack; the folders move back once it has closed too.
WaitForEXE1=qemu-system-x86_64w.exe
WaitForEXE2=qemu-system-x86_64.exe

[Activate]
DirectoryCleanup=true

; ISOrack is a Tauri app with the identifier dev.isorack.app. Its own
; settings (a custom catalog.toml) are in %APPDATA%\ISOrack; WebView2 keeps
; the page's storage (the download folder, the theme) in EBWebView under
; its local app data folder. Both are moved into Data for the session.
[DirectoriesMove]
ISOrack=%APPDATA%\ISOrack
LocalAppData=%LOCALAPPDATA%\dev.isorack.app

; WebView2's caches are rebuilt on the next start, so they aren't carried
; back to the drive.
[DirectoriesCleanupForce]
1=%LOCALAPPDATA%\dev.isorack.app\EBWebView\Default\Cache
2=%LOCALAPPDATA%\dev.isorack.app\EBWebView\Default\Code Cache
3=%LOCALAPPDATA%\dev.isorack.app\EBWebView\Default\GPUCache
4=%LOCALAPPDATA%\dev.isorack.app\EBWebView\Default\DawnGraphiteCache
5=%LOCALAPPDATA%\dev.isorack.app\EBWebView\Default\DawnWebGPUCache
6=%LOCALAPPDATA%\dev.isorack.app\EBWebView\GrShaderCache
7=%LOCALAPPDATA%\dev.isorack.app\EBWebView\ShaderCache
8=%LOCALAPPDATA%\dev.isorack.app\EBWebView\Crashpad

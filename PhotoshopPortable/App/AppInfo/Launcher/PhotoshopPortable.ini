[Launch]
ProgramExecutable=Photoshop\Photoshop.exe
; The launcher needs administrator rights: Photoshop's shared files live in
; Common Files and the product language in HKLM. Photoshop itself is started
; with the signed in user's normal rights, so drag and drop from Explorer
; works (see custom.nsh). A second launch isn't elevated.
RunAsAdmin=force
SingleAppInstance=true
; A second launch hands its files to the running Photoshop.
SinglePortableAppInstance=false
RefreshShellIcons=both
DirectoryMoveOK=yes
SupportsUNC=no

[Activate]
Symlinks=true
MissingApp=true

[MissingApp]
Reason=commercial
URL=https://www.adobe.com/products/photoshop.html

; Photoshop's settings, the color settings Adobe applications share, and the
; Common Files records Adobe's installer leaves for Photoshop are linked into
; Data while it runs, so nothing is copied back and forth. Anything already
; in one of these places (from an installed Adobe application) is moved
; aside for the session and put back afterwards. The Common Files links
; follow the 32-bit Common Files folder, the one Photoshop CS3 uses.
[Symlink1]
Type=junction
Source=AppData\Adobe\Adobe Photoshop CS3
Target=%APPDATA%\Adobe\Adobe Photoshop CS3

[Symlink2]
Type=junction
Source=AppData\Adobe\Color
Target=%APPDATA%\Adobe\Color

[Symlink3]
Type=junction
Source=AppData\Adobe\Save For Web
Target=%APPDATA%\Adobe\Save For Web

[Symlink4]
Type=junction
Source=AppData\Adobe\Adobe PDF
Target=%APPDATA%\Adobe\Adobe PDF

[Symlink5]
Type=junction
Source=AppData\Adobe\Workflow
Target=%APPDATA%\Adobe\Workflow

[Symlink6]
Type=junction
Source=LocalAppData\Adobe\Color
Target=%LOCALAPPDATA%\Adobe\Color

[Symlink7]
Type=junction
Source=CommonFiles\Adobe\Adobe PCD
Target=%CommonProgramFiles%\Adobe\Adobe PCD

[Symlink8]
Type=junction
Source=CommonFiles\Adobe\caps
Target=%CommonProgramFiles%\Adobe\caps

[Symlink9]
Type=junction
Source=CommonFiles\Adobe\backup
Target=%CommonProgramFiles%\Adobe\backup

; Machine-wide keys Photoshop CS3 has for itself: its file types, its
; scripting (COM) classes, interfaces and type libraries, and its own key.
; Each one is journaled before Photoshop starts: one that didn't exist is
; deleted when it closes, and one that did (from an installed Photoshop) is
; put back exactly as it was. The keys are in the 32-bit registry view, the
; one Photoshop CS3 uses.
[PhotoshopRegistry]
1=HKLM\SOFTWARE\Adobe\Photoshop
2=HKLM\SOFTWARE\Classes\.psb
3=HKLM\SOFTWARE\Classes\Photoshop.Application

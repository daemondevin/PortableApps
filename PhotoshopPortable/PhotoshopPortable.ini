[PhotoshopPortable]
AdditionalParameters=
DisableSplashScreen=false
RunLocally=false
ProductLanguage=en_us

# ProductLanguage=
; The language Adobe's shared code is told Photoshop runs in, as Adobe
; writes it (en_us, de_de, fr_fr and so on). It has to match a language the
; Photoshop in this package has.

# AdditionalParameters=
; Pass additional command-line switches.

# DisableSplashScreen=
; Don't show the launcher's splash screen.

# RunLocally=
; Copy Photoshop to the TEMP folder and run it from there (for read-only
; media). Changes made in that session aren't saved back.

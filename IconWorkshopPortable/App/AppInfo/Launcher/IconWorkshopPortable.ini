[Launch]
ProgramExecutable=IconWorkshop\IconWorkshop.exe
DirectoryMoveOK=yes
SupportsUNC=yes
MinOS=7

[Activate]
MissingApp=true

; IconWorkshop is commercial; you add your own licensed copy. Until then,
; the launcher says what to do and stops.
[MissingApp]
Reason=IconWorkshop is commercial software by Axialis. Add your own licensed copy from axialis.com to this package.
URL=https://www.axialis.com/iconworkshop/
Folder=IconWorkshop

; Templates, color swatches and tables; and the work and preview files
; IconWorkshop keeps in %LOCALAPPDATA%\Axialis.
[DirectoriesMove]
IconWorkshop=%APPDATA%\Axialis\IconWorkshop
Axialis=%LOCALAPPDATA%\Axialis

[DirectoriesCleanupIfEmpty]
1=%APPDATA%\Axialis

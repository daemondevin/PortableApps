[Launch]
ProgramExecutable=Abyssal\abyssal-drift.exe
DirectoryMoveOK=yes
SupportsUNC=yes
MinOS=10

[Activate]
DirectoryCleanup=true

[DirectoriesMove]
AppData=%APPDATA%\dev.abyssaldrift.pinball
LocalAppData=%LOCALAPPDATA%\dev.abyssaldrift.pinball

[DirectoriesCleanupForce]
1=%LOCALAPPDATA%\dev.abyssaldrift.pinball\EBWebView\Default\Cache
2=%LOCALAPPDATA%\dev.abyssaldrift.pinball\EBWebView\Default\Code Cache
3=%LOCALAPPDATA%\dev.abyssaldrift.pinball\EBWebView\Default\GPUCache
4=%LOCALAPPDATA%\dev.abyssaldrift.pinball\EBWebView\Default\DawnGraphiteCache
5=%LOCALAPPDATA%\dev.abyssaldrift.pinball\EBWebView\Default\DawnWebGPUCache
6=%LOCALAPPDATA%\dev.abyssaldrift.pinball\EBWebView\GrShaderCache
7=%LOCALAPPDATA%\dev.abyssaldrift.pinball\EBWebView\ShaderCache
8=%LOCALAPPDATA%\dev.abyssaldrift.pinball\EBWebView\Crashpad

[Launch]
; RipX DAW is 64-bit only; the launcher refuses to start on 32-bit Windows
; (see custom.nsh).
ProgramExecutable=RipXDAW\RipX.exe
; The launcher needs administrator rights: RipX reads where its resources
; are, and its installation details, from HKLM\SOFTWARE\HitnMix. RipX itself
; is started with the signed in user's normal rights, so dragging audio
; files into it from Explorer works (see custom.nsh). A second launch isn't
; elevated.
RunAsAdmin=force
SingleAppInstance=true
; A second launch hands its files to the running RipX.
SinglePortableAppInstance=false
RefreshShellIcons=both
DirectoryMoveOK=yes
SupportsUNC=no
MinOS=10

[Activate]
MissingApp=true
Symlinks=true

[MissingApp]
Reason=commercial
URL=https://hitnmix.com/
Folder=RipXDAW
RequiredFile1=RipXDAW\RipX.exe
RequiredFile2=RipXDAW\Ripper_x64.dll

; RipX keeps its rips, stems, loops, sound palettes, RipLists and RipScripts
; in Documents\RipX, and its shared instrument data in %APPDATA%\Hit'n'Mix.
; Both are linked into Data while it runs, so nothing is copied back and
; forth (rips are often hundreds of megabytes each). A real folder already
; in either place (from an installed RipX) is moved aside for the session
; and put back afterward.
[Symlink1]
Type=junction
Source=RipX
Target=%DOCUMENTS%\RipX

[Symlink2]
Type=junction
Source=Hit'n'Mix
Target=%APPDATA%\Hit'n'Mix

[RipXDAWPortable]
AdditionalParameters=
DisableSplashScreen=false
Symlinks=true

# Symlinks=
; Link RipX's folders into Data while it runs (true|false). With false, RipX
; uses Documents\RipX and %APPDATA%\Hit'n'Mix on this computer and nothing in
; them travels with the package.

# AdditionalParameters=
; Pass additional command-line switches.

# DisableSplashScreen=
; Don't show the launcher's splash screen.

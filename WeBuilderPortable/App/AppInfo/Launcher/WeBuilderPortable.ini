[Launch]
ProgramExecutable=WeBuilder\webuild.exe
WorkingDirectory=%PAL:AppDir%\WeBuilder
; RunAsAdmin=force
MinOS=10
DirectoryMoveOK=yes
SupportsUNC=no
SingleAppInstance=true
; A second launch hands its files to the running WeBuilder.
SinglePortableAppInstance=false

[Activate]
Symlinks=true
Firewall=true
MissingApp=true

[MissingApp]
Reason=commercial
URL=https://www.blumentals.net/webuilder/
Folder=WeBuilder
RequiredFile1=WeBuilder\Data\*.*

; WeBuilder runs in portable mode when App\WeBuilder\settings exists, and
; keeps all its settings there. That folder is linked to Data\config while
; it runs, so nothing is copied back and forth and the link is removed
; again afterwards (also after a crash).
[Symlink1]
Type=junction
Source=config
Target=%PAL:AppDir%\WeBuilder\settings

; The settings.dat section custom.nsh writes the Firefox=, Chrome=, Opera=
; and DiffTool= user settings to. Change it if a WeBuilder update moves it.
[WeBuilderTools]
Section=HKEY_CURRENT_USER\Software\Karlis Blumentals\WeBuilder\18.0\Tools

; If you uncomment this section you must add RunAsAdmin=force above
; in the [Launch] section and then recompile using the latest version
; of PAC-MAN
; [FirewallRule1]
; Name=WeBuilder
; Direction=out
; Action=Block
; Protocol=Any
; Profile=Any
; Enabled=true
; Required=true
; Program=%PAL:AppDir%\WeBuilder\webuild.exe

[WeBuilderPortable]
AdditionalParameters=
DisableSplashScreen=false
Firefox=
Chrome=
Opera=
DiffTool=

# Firefox=, Chrome=, Opera=
; Browsers WeBuilder previews pages in, for example
; %PAL:PortableAppsDir%\FirefoxPortable\FirefoxPortable.exe
; Leave empty to keep what is set in WeBuilder itself.

# DiffTool=
; The file compare tool, with %file1 and %file2 where the two files go, for
; example
; %PAL:PortableAppsDir%\ExamDiffProPortable\ExamDiffProPortable.exe "%file1" "%file2"
; Leave empty to keep what is set in WeBuilder itself.

# AdditionalParameters=
; Pass additional command-line switches.

# DisableSplashScreen=
; Don't show the launcher's splash screen.

[Launch]
; Without VLC in App\vlc, custom.nsh offers to download it.
ProgramExecutable=vlc\vlc.exe
DirectoryMoveOK=yes
SupportsUNC=yes

; libdvdcss keeps the keys of DVDs it has played here.
[Environment]
DVDCSS_CACHE=%PAL:DataDir%\dvdcss

; libaacs reads its Blu-ray key database (KEYDB.cfg) and keeps its cache in
; %APPDATA%\aacs, with no variable to point it elsewhere.
[DirectoriesMove]
aacs=%APPDATA%\aacs

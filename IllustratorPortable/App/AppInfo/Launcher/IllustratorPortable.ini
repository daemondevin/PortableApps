[Launch]
ProgramExecutable=Illustrator\Support Files\Contents\Windows\Illustrator.exe
; The launcher needs administrator rights: Illustrator's shared files live
; in Common Files and Program Data and the product language in HKLM.
; Illustrator itself is started with the signed in user's normal rights, so
; drag and drop from Explorer works (see custom.nsh). A second launch isn't
; elevated.
RunAsAdmin=force
SingleAppInstance=true
; A second launch hands its files to the running Illustrator.
SinglePortableAppInstance=false
RefreshShellIcons=both
DirectoryMoveOK=yes
SupportsUNC=no

[Activate]
Symlinks=true
MissingApp=true

[MissingApp]
Reason=commercial
URL=https://www.adobe.com/products/illustrator.html

; Illustrator's settings and the shared files it expects to find where
; Adobe's installer puts them are linked into Data while it runs, so nothing
; is copied back and forth. Anything already in one of these places (from an
; installed Adobe application) is moved aside for the session and put back
; afterwards. The Common Files links follow the 32-bit Common Files folder,
; the one Illustrator CS3 uses.
[Symlink1]
Type=junction
Source=Adobe Illustrator CS3 Settings
Target=%APPDATA%\Adobe\Adobe Illustrator CS3 Settings

[Symlink2]
Type=junction
Source=Adobe PDF
Target=%ALLUSERSAPPDATA%\Adobe\Adobe PDF

[Symlink3]
Type=junction
Source=CommonFiles\Plug-Ins\CS3
Target=%CommonProgramFiles%\Adobe\Plug-Ins\CS3

[Symlink4]
Type=junction
Source=CommonFiles\TypeSupport
Target=%CommonProgramFiles%\Adobe\TypeSupport

[Symlink5]
Type=junction
Source=CommonFiles\XMP\Custom File Info Panels
Target=%CommonProgramFiles%\Adobe\XMP\Custom File Info Panels

[Symlink6]
Type=junction
Source=CommonFiles\Help\Illustrator
Target=%CommonProgramFiles%\Adobe\Help\en_US\Illustrator

; Registry keys Illustrator writes for itself: its file types, its
; scripting (COM) classes and type library (when it runs elevated), and the
; payload records
; Adobe's licensing code keeps. Each one is journaled before Illustrator
; starts: one that didn't exist is deleted when it closes, and one that did
; (from an installed Illustrator) is put back exactly as it was. The keys
; are in the 32-bit registry view, the one Illustrator CS3 uses.
[IllustratorRegistry]
1=HKLM\SOFTWARE\Classes\.ps
2=HKLM\SOFTWARE\Classes\.win
3=HKLM\SOFTWARE\Classes\Adobe.ColorSettings
